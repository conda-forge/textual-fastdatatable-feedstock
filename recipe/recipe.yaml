schema_version: 1

context:
  name: textual-fastdatatable
  version: "0.17.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/textual_fastdatatable-${{ version }}.tar.gz
  sha256: 401865e706b882f9d750424674a6ce782bffd42c6087221d9d87c4857680e252

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - textual >=7.3.0
    - pyarrow >=18.1.0
    - typing_extensions >=4.4.0
tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - textual_fastdatatable

about:
  summary: A performance-focused reimplementation of Textual's DataTable widget, with a pluggable data storage backend.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/tconbeer/textual-fastdatatable

extra:
  recipe-maintainers:
    - xhochy
